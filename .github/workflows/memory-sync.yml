name: Hugo Memory Sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync memory changes
        run: |
          HUGO_MEMORY_AUTO_PUSH=true node scripts/memory-git-sync.js