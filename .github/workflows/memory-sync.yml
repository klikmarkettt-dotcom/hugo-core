name: Hugo Memory Sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit local memory changes
        run: |
          git config user.email "hugo@users.noreply.github.com"
          git config user.name "Hugo Bot"
          git add memory
          git diff --cached --quiet || git commit -m "Sync local memory"
          git push