name: Hugo Higgsfield Health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check scripts/higgsfield-client.js && node --check scripts/higgsfield-tools.js