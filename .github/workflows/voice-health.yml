name: Hugo Voice Health
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check scripts/voice-engine.js && node --check scripts/voice-commands.js && jq empty data/voice-full.json