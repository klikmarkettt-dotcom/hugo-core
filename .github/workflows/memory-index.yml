name: Hugo Memory Index
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          node --check scripts/memory-graph.js
          node --check scripts/memory-embed.js
          node --check scripts/memory-temporal.js
          node --check scripts/memory-backlinks.js
          jq empty memory/knowledge-graph.json memory/temporal-index.json memory/backlinks.json